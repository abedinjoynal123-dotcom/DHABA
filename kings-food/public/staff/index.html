<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0C0C0E">
<link rel="icon" href="/assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<style>html,body{margin:0}body{background:#F4F3EF}
.pairsheet{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 35%,#2a1a0c,#070708 75%);color:#F2EEE4;font-family:Manrope,system-ui,sans-serif}
.pairbox{width:min(380px,100%);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.pairbox .logo{width:96px;height:96px;margin-bottom:6px}
.pairbox h2{font-family:"Cormorant Garamond",Georgia,serif;font-size:2rem;margin:0}
.pairbox .sub{margin:0 0 8px;color:rgba(242,238,228,.7);line-height:1.5}
.pairbox label{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;font-weight:700;font-size:.85rem}
.pairbox input{font:inherit;font-size:1.3rem;letter-spacing:.2em;text-align:center;padding:12px;border-radius:12px;border:1px solid rgba(205,166,88,.45);background:rgba(255,255,255,.06);color:#fff}
.pairbox .perr{min-height:1.2em;margin:0;color:#F07A72;font-weight:700}
.pairbox .place{width:100%}</style>
</head>
<body>
<title>King's Food POS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: enterprise POS shell. A dark rail on the left (top strip on phones), a slim top bar, then the working surface.
   Palette: graphite with burnished gold from the medallion; oxblood reserved for brand moments. */
:root{
  --bg:#F4F3EF; --surface:#FFFFFF; --surface-2:#F1EFEA; --ink:#141416; --muted:#6B6862; --line:#E3E0D8;
  --rail:#0C0C0E; --rail-2:#17171A; --rail-ink:#EDEAE3; --rail-muted:#8D8A84;
  --accent:#A47C30; --accent-ink:#1A1306; --accent-soft:#F3E9D2; --wine:#6B1420; --wine-ink:#F6E7C4; --price:#141416;
  --gold-grad:linear-gradient(135deg,#9C6E1C 0%,#D9B25A 38%,#F2D88E 52%,#C99A3B 70%,#8F6418 100%);
  --new:#B42330; --new-soft:#F8E1DF; --prep:#946012; --prep-soft:#F6E8C9; --ready:#1F7247; --ready-soft:#DDF0E3;
  --paper:#FFFFFF; --paper-ink:#1B1A18; --screen:#0B0B0C;
  --f-brand:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,20,22,.05), 0 8px 24px -18px rgba(20,20,22,.35);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F11; --surface:#18181B; --surface-2:#202024; --ink:#F2F0EA; --muted:#9B988F; --line:#2B2B30;
  --rail:#070708; --rail-2:#131315; --accent:#CDA658; --accent-soft:#2E2614; --wine:#7E1B29; --price:#E6C47A;
  --new:#F07A72; --new-soft:#3A1A1B; --prep:#E3B65A; --prep-soft:#302612; --ready:#6BCB95; --ready-soft:#142B1F;
  --paper:#1C1C20; --paper-ink:#EEEAE1; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -22px rgba(0,0,0,.9); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F0F11; --surface:#18181B; --surface-2:#202024; --ink:#F2F0EA; --muted:#9B988F; --line:#2B2B30;
  --rail:#070708; --rail-2:#131315; --accent:#CDA658; --accent-soft:#2E2614; --wine:#7E1B29; --price:#E6C47A;
  --new:#F07A72; --new-soft:#3A1A1B; --prep:#E3B65A; --prep-soft:#302612; --ready:#6BCB95; --ready-soft:#142B1F;
  --paper:#1C1C20; --paper-ink:#EEEAE1; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 30px -22px rgba(0,0,0,.9); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--rail)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}

/* ===== shell ===== */
.shell{display:grid;grid-template-columns:96px minmax(0,1fr);min-height:100%}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding-block:18px 18px;padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:8px;border-right:1px solid rgba(205,166,88,.18);z-index:6}
.logo{display:inline-block;width:58px;height:58px;flex:none;border-radius:50%;background:url("/assets/img/logo-256.webp") center/cover no-repeat;
  box-shadow:0 0 0 1.5px #CDA658, 0 8px 22px -8px rgba(0,0,0,.7)}
.rail .logo{margin-bottom:14px}
.rail nav{display:flex;flex-direction:column;gap:4px;width:100%}
.navbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;border:0;background:transparent;color:var(--rail-muted);
  padding:10px 4px;border-radius:12px;font-size:.68rem;font-weight:700;letter-spacing:.03em;width:100%;text-align:center;line-height:1.15}
.navbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.navbtn:hover{color:var(--rail-ink);background:var(--rail-2)}
.navbtn[aria-current="page"]{color:#F2D88E;background:var(--rail-2)}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--gold-grad)}
.navbtn .badge{position:absolute;top:4px;right:12px}
.badge{min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold-grad);color:#1A1306;font-size:.68rem;font-weight:800;display:inline-grid;place-items:center}
.rail .foot{margin-top:auto;font-size:.6rem;letter-spacing:.14em;color:var(--rail-muted);text-transform:uppercase;writing-mode:vertical-rl;transform:rotate(180deg)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:color-mix(in srgb, var(--bg) 92%, transparent);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  padding-block:14px 12px;padding-left:28px;padding-right:max(28px, env(safe-area-inset-right, 0px))}
.ttl{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.ttl .eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:800}
.ttl h1{margin:2px 0 0;font-size:1.55rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.pill-status{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--ready);box-shadow:0 0 0 3px color-mix(in srgb, var(--ready) 22%, transparent)}
.dot.shut{background:var(--new);box-shadow:0 0 0 3px color-mix(in srgb, var(--new) 22%, transparent)}
.clock{font-weight:700;font-size:.9rem}
.lang{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:transparent;border-radius:999px;padding:5px 10px;font-size:.76rem;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.content{padding-block:22px 110px;padding-left:28px;padding-right:max(28px, env(safe-area-inset-right, 0px))}
.banner{background:var(--new-soft);color:var(--new);border-radius:10px;padding:10px 14px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
section.view{display:none}
section.view.on{display:block}

@media (max-width:880px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top, 0px);height:auto;flex-direction:row;padding:8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));gap:8px;border-right:0;border-bottom:1px solid rgba(205,166,88,.22)}
  .rail .logo{width:40px;height:40px;margin:0}
  .rail nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:2px}
  .rail nav::-webkit-scrollbar{display:none}
  .navbtn{width:auto;min-width:64px;padding:6px 8px;font-size:.64rem}
  .navbtn svg{width:19px;height:19px}
  .navbtn[aria-current="page"]::before{left:14px;right:14px;top:auto;bottom:-8px;width:auto;height:3px;border-radius:3px 3px 0 0}
  .navbtn .badge{right:2px;top:0}
  .rail .foot{display:none}
  .topbar{position:static;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .ttl h1{font-size:1.25rem}
  .topbar{gap:8px 10px;padding-block:10px}
  .ttl{flex:1 1 100%}
  .clock{display:none}
  .pill-status{padding:4px 10px;font-size:.74rem}
  .lang{margin-left:auto}
  .content{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}

/* ===== shared ===== */
.sec-h{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:0 0 16px}
.sec-h p{margin:0;color:var(--muted);font-size:.9rem;max-width:66ch}
.chip{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:999px;font-weight:700;font-size:.82rem;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--bg);background:var(--ink)}
.chip.warnon[aria-pressed="true"]{border-color:var(--new);color:var(--new);background:var(--new-soft)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 20px;color:var(--muted);text-align:center}
.empty b{color:var(--ink);display:block;margin-bottom:4px}
.act{border:1px solid transparent;border-radius:9px;padding:8px 14px;font-weight:700;font-size:.88rem}
.act.go{background:var(--ink);color:var(--bg)}
.act.lite{background:var(--surface);color:var(--ink);border-color:var(--line)}
.act.warn{background:var(--new-soft);color:var(--new)}
.act.acc{background:var(--gold-grad);color:var(--accent-ink)}
.act:disabled{opacity:.45}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 14px;font-size:1rem;font-weight:800;letter-spacing:-.01em}
.lab,.fld2 label,.kpi .l,.close-grid .cell .l,th{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted)}

/* ===== till ===== */
.till{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:22px;align-items:start}
@media (max-width:1100px){.till{grid-template-columns:minmax(0,1fr) 340px}}
@media (max-width:880px){.till{grid-template-columns:minmax(0,1fr)}}
.tillbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tillbar .sp{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px 16px 14px;min-height:116px;
  display:flex;flex-direction:column;justify-content:space-between;gap:10px;box-shadow:var(--shadow);transition:transform .08s ease, border-color .15s, box-shadow .15s;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-grad);opacity:0;transition:opacity .2s}
.tile:hover{border-color:color-mix(in srgb, var(--accent) 60%, var(--line))}
.tile:hover::before,.tile.has::before{opacity:1}
.tile:active{transform:scale(.97)}
.tile .n{font-weight:800;font-size:1.02rem;line-height:1.2;letter-spacing:-.01em}
.tile .o{display:block;margin-top:4px;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:800}
.tile .p{font-weight:800;font-size:1.12rem;color:var(--price);font-variant-numeric:tabular-nums lining-nums}
.tile .p s{color:var(--muted);font-weight:500;font-size:.78rem;margin-right:6px}
.tile .q{position:absolute;top:10px;right:10px;background:var(--wine);color:var(--wine-ink);font-weight:800;font-size:.76rem;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 1.5px #CDA658}
.tile.out{background:var(--surface-2);box-shadow:none}
.tile.out .n,.tile.out .p{opacity:.45}
.tile .stamp{position:absolute;bottom:14px;right:12px;font-size:.64rem;font-weight:800;letter-spacing:.08em;color:var(--new);border:1.5px solid var(--new);border-radius:4px;padding:1px 5px;transform:rotate(4deg)}
.tiles.sold-mode .tile{border-style:dashed;border-color:var(--new)}
.picker{position:fixed;inset:0;z-index:30;background:rgba(8,8,10,.55);display:grid;place-items:end center;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
@media (min-width:700px){.picker{place-items:center}}
.picker .box{background:var(--surface);color:var(--ink);border-radius:16px;padding:20px;width:min(420px,100%);display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.picker h3{margin:0;font-size:1.25rem;font-weight:800}
.picker .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.picker .opts button{padding:20px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:800;font-size:1.05rem}
.picker .opts button:hover{border-color:var(--accent)}

.ticket{position:sticky;top:96px;background:var(--paper);color:var(--paper-ink);border-radius:14px 14px 0 0;border:1px solid var(--line);border-bottom:0;
  font-family:var(--f-mono);font-size:.86rem;padding:20px 20px 32px;box-shadow:var(--shadow);
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;
  max-height:calc(100vh - 120px);overflow:auto}
@media (max-width:880px){.ticket{position:static;max-height:none}}
.ticket .tlogo{display:block;width:50px;height:50px;margin:0 auto 8px}
.ticket h2{font-family:var(--f-body);font-weight:800;font-size:1.15rem;letter-spacing:.12em;margin:0;text-align:center}
.ticket .sub{text-align:center;font-size:.72rem;opacity:.65;margin-top:3px}
.rule{border:0;border-top:1.5px dashed currentColor;opacity:.3;margin:13px 0}
.lines{display:flex;flex-direction:column;gap:8px;min-height:40px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.line .nm{min-width:0;overflow-wrap:anywhere}
.line .nm i{font-style:normal;opacity:.65;font-size:.78rem;display:block}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:28px;height:28px;border:1px solid color-mix(in srgb, currentColor 30%, transparent);background:transparent;border-radius:7px;line-height:1;font-weight:700}
.stepper span{min-width:22px;text-align:center;font-weight:700}
.seg{display:flex;border:1px solid color-mix(in srgb, currentColor 22%, transparent);border-radius:9px;overflow:hidden;font-family:var(--f-body)}
.seg button{flex:1;border:0;background:transparent;padding:8px 4px;font-size:.78rem;font-weight:700;min-width:0}
.seg button+button{border-left:1px solid color-mix(in srgb, currentColor 12%, transparent)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fld .lab{color:inherit;opacity:.6;font-family:var(--f-body)}
.fld input{background:transparent;border:1px solid color-mix(in srgb, currentColor 22%, transparent);border-radius:9px;padding:9px 11px;font-family:var(--f-mono);width:100%;min-width:0}
.notes{display:flex;flex-wrap:wrap;gap:5px;font-family:var(--f-body)}
.notes button{border:1px solid color-mix(in srgb, currentColor 22%, transparent);background:transparent;border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:600}
.notes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tot.sm{font-size:.82rem;opacity:.75}
.tot.big{font-family:var(--f-body);font-weight:800;font-size:1.5rem;margin-top:4px;letter-spacing:-.01em}
.hint{font-size:.72rem;opacity:.7;font-family:var(--f-body)}
.place{width:100%;margin-top:14px;border:0;border-radius:11px;padding:16px;background:var(--gold-grad);color:var(--accent-ink);font-family:var(--f-body);font-weight:800;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 10px 22px -12px rgba(140,90,20,.9);position:relative;overflow:hidden}
.place::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s ease}
.place:not(:disabled):hover::after{transform:translateX(120%)}
.place:disabled{opacity:.45;box-shadow:none}
.ghost{background:transparent;border:0;text-decoration:underline;font-size:.76rem;opacity:.7;padding:4px 6px;font-family:var(--f-body)}
.mbar{display:none}
@media (max-width:880px){
  .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:7;gap:12px;align-items:center;justify-content:space-between;
    padding:12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background:var(--rail);color:var(--rail-ink);border-top:1px solid rgba(205,166,88,.4)}
  .mbar[hidden]{display:none!important}
  .mbar button{border:0;border-radius:999px;padding:10px 18px;background:var(--gold-grad);color:#1A1306;font-weight:800}
}

/* ===== kitchen ===== */
.cooknow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.cooknow .lab{margin-right:6px}
.cooknow .it{background:var(--accent-soft);border-radius:8px;padding:5px 10px;font-weight:700;font-size:.9rem}
.cooknow .it b{margin-right:4px}
.cooknow .tools{margin-left:auto;display:flex;gap:8px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-items:start}
@media (max-width:980px){.board{grid-template-columns:minmax(0,1fr)}}
.col h3{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;color:var(--muted)}
.col h3 .count{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;border-left:4px solid var(--muted);box-shadow:var(--shadow)}
.card.s-new{border-left-color:var(--new)} .card.s-preparing{border-left-color:var(--prep)} .card.s-ready{border-left-color:var(--ready)}
.card.fresh{animation:flash 1.2s ease 2}
@keyframes flash{50%{box-shadow:0 0 0 4px var(--accent)}}
.card .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .no{font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:-.02em}
.pill{font-size:.66rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill.app{background:var(--accent-soft);color:var(--ink)}
.pill.eat{background:var(--ink);color:var(--bg)}
.age{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--muted)}
.age.late{color:var(--new)}

@media (max-width:820px){.sgrid{grid-template-columns:minmax(0,1fr)}.sphoto{max-height:220px;overflow:hidden}}
.sphoto img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.sgrid.rev .sphoto{position:sticky;top:0}
.sreading{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 4px}
.sreading p{margin:0;max-width:52ch}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:#C99A3B;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errt{color:var(--new)}
.sform{display:flex;flex-direction:column;gap:10px;min-width:0}
.snote{margin:0;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.88rem}
.sfields{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.sfields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.swarn{margin:0;background:var(--new-soft);color:var(--new);border-radius:10px;padding:9px 12px;font-weight:700;font-size:.88rem}
.scheck{margin:0;font-size:.86rem;font-weight:700;color:var(--muted)}
.scheck.ok{color:var(--ready)} .scheck.bad{color:var(--new)}
.slines{display:flex;flex-direction:column;gap:8px}
.sline{position:relative;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 40px 10px 10px;background:var(--surface-2)}
.sline.ign{opacity:.6}
@media (max-width:700px){.sline{grid-template-columns:minmax(0,1fr)}}
.sline input,.sline select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 9px;width:100%;min-width:0;font-size:.9rem}
.sl-a{display:flex;flex-direction:column;gap:6px;min-width:0}
.sl-a>input{font-weight:700}
.sl-nums{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.sl-nums label,.sl-in{display:flex;flex-direction:column;gap:3px;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.sl-nums label input{width:92px}
.sl-b{display:flex;flex-direction:column;gap:6px;min-width:0}
.sl-new{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:6px}
.sl-in{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:.82rem;flex-wrap:wrap}
.sl-in span{font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.64rem}
.sl-in input{width:96px}
.sl-in b{color:var(--ink)}
.sl-x{position:absolute;top:8px;right:8px;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--muted)}
.sl-x:hover{background:var(--surface);color:var(--new)}
.tag{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;background:var(--surface);color:var(--muted);align-self:center}
.tag.ok{background:var(--ready-soft);color:var(--ready)} .tag.warn{background:var(--prep-soft);color:var(--prep)}
.sactions .place{margin-top:4px}
.sdone{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px}
.sdone .logo{width:54px;height:54px}
.sdone h4{margin:0;font-size:1.3rem}
.sdone p{margin:0;color:var(--muted)}
.sdone ul{list-style:none;padding:0;margin:6px 0 10px;display:flex;flex-direction:column;gap:4px}

/* ===== polish ===== */
.toast{display:flex;align-items:center;gap:14px}
.toast[hidden]{display:none!important}
#toastBtn{border:0;background:transparent;color:#F2D88E;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.78rem;padding:4px 2px;border-bottom:1.5px solid rgba(242,216,142,.6)}
.placedlay{position:fixed;inset:0;z-index:35;background:rgba(6,6,8,.62);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.placedlay .dbox{width:min(400px,100%);background:var(--surface);color:var(--ink);border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line));border-radius:20px;padding:26px 24px 20px;text-align:center;
  display:flex;flex-direction:column;gap:8px;box-shadow:0 30px 80px -30px rgba(0,0,0,.7);animation:rise .28s cubic-bezier(.2,.9,.3,1.2)}
.placedlay .logo{width:54px;height:54px;margin:0 auto 4px}
.placedlay .dlab{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.placedlay .dno{font-family:var(--f-brand);font-weight:700;font-size:6.4rem;line-height:.9;letter-spacing:-.02em}
.placedlay .dtell{color:var(--muted);font-size:.9rem;margin-bottom:8px}
.placedlay .drow{display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed var(--line);padding-top:10px;font-weight:700}
.placedlay .drow b{font-size:1.15rem}
.placedlay .drow.big{background:var(--accent-soft);border:0;border-radius:12px;padding:12px 14px}
.placedlay .drow.big b{font-size:1.7rem}
.placedlay .dmeta{color:var(--muted);font-size:.82rem;margin-top:2px}
@keyframes rise{from{transform:translateY(14px) scale(.97);opacity:0}}
.tile.skel{pointer-events:none;box-shadow:none}
.tile.skel span{display:block;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),color-mix(in srgb, var(--surface-2) 40%, var(--surface)),var(--surface-2));background-size:200% 100%;animation:shim 1.3s linear infinite}
.tile.skel .sk1{height:14px;width:70%}
.tile.skel .sk2{height:18px;width:40%}
@keyframes shim{to{background-position:-200% 0}}
.tile .q.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pop{from{transform:scale(.4)}}
.screen .ready span.pop{animation:readyin .7s cubic-bezier(.2,.9,.3,1.3), glow 2.4s ease-in-out .7s infinite}
@keyframes readyin{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}}
.cmp{display:inline-block;margin-top:8px;font-size:.74rem;font-weight:800;border-radius:999px;padding:3px 9px}
.cmp.up{background:rgba(107,203,149,.16);color:#6BCB95}
.cmp.down{background:rgba(240,122,114,.16);color:#F07A72}
/* touch targets for tablets */
.card .act,.cooknow .act{min-height:44px;padding:9px 14px}
.stepper button{width:34px;height:34px}
.seg button{min-height:40px}
.notes button{min-height:32px}
.chip{min-height:38px}
.mrow .act{min-height:38px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom, 0px));background:var(--rail);color:var(--rail-ink);border:1px solid rgba(205,166,88,.5);padding:11px 18px;border-radius:11px;font-weight:700;z-index:70;max-width:calc(100% - 32px);box-shadow:0 12px 30px -12px rgba(0,0,0,.6)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- King's Food POS runtime for the website (Netlify) ----------
   The POS app talks to window.claude.use(name). Here those come from this
   site's own server (/api/pos/*) and the browser:
     db         shared data, synced by polling the server
     user       always allowed (permissions are enforced on the server)
     downloads  file downloads
     assets     invoice photos stored on the server
     sample     Claude, through /api/pos-ai (needs ANTHROPIC_API_KEY on Netlify)
     tts        the browser's own speech (speechSynthesis)
     dictation  the browser's speech recognition (Chrome, Edge, Safari)
*/
(function(){
"use strict";
const API="/api/pos/";
const HDR={"content-type":"application/json","x-kf":"1"};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,"0");
const dayOf=ms=>{ const d=new Date(ms); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const lang=()=>{ try{ const l=localStorage.getItem("kf_lang"); if(["et","en","ru"].includes(l)) return l; }catch(e){} const n=(navigator.language||"et").slice(0,2); return ["et","en","ru"].includes(n)?n:"et"; };
const tr=(k)=>{ try{ return (T[lang()]&&T[lang()][k])||T.en[k]||k; }catch(e){ return k; } };
const err=(code,extra)=>Object.assign(new Error(code),{code},extra||{});

async function call(path, body, method){
  let res;
  try{ res=await fetch(API+path,{method:method||(body===undefined?"GET":"POST"), headers:HDR, body:body===undefined?undefined:JSON.stringify(body), credentials:"same-origin", cache:"no-store"}); }
  catch(e){ throw err("unavailable"); }
  let data={}; try{ data=await res.json(); }catch(e){}
  if(res.status===401 && data.error==="not_paired"){ showPair(); throw err("unavailable"); }
  if(res.status===401 && data.error==="session"){ expired(); throw err("revoked"); }
  if(res.status===403) throw err("permission_denied");
  if(res.status===429) throw err("resource_exhausted");
  if(res.status>=500) throw err("unavailable");
  if(!res.ok) throw err(data.error==="not_found"?"not_found":"invalid_argument",{server:data.error});
  return data;
}

/* ---------- session ---------- */
const NET={ session:null, ai:false, booted:null };
let expiredSent=false;
function expired(){ NET.session=null; if(expiredSent) return; expiredSent=true; setTimeout(()=>{ expiredSent=false; },3000); window.dispatchEvent(new Event("kf:session-expired")); }
NET.login=async(id,pin)=>{
  try{ const r=await fetch(API+"login",{method:"POST",headers:HDR,body:JSON.stringify({id,pin}),credentials:"same-origin"}); const d=await r.json().catch(()=>({}));
    if(r.ok){ NET.session={id:d.member.id, role:d.member.role}; DB.kick(); return {ok:true, member:d.member}; }
    return {ok:false, wait:d.wait||0}; }catch(e){ return {ok:false, offline:true}; }
};
NET.setup=async(name,pin)=>{
  try{ const r=await fetch(API+"setup",{method:"POST",headers:HDR,body:JSON.stringify({name,pin}),credentials:"same-origin"}); const d=await r.json().catch(()=>({}));
    if(r.ok){ NET.session={id:d.member.id, role:d.member.role}; DB.kick(); return {ok:true, member:d.member}; }
    return {ok:false, error:d.error}; }catch(e){ return {ok:false, error:"offline"}; }
};
NET.logout=()=>{ NET.session=null; fetch(API+"logout",{method:"POST",headers:HDR,credentials:"same-origin"}).catch(()=>{}); DB.dropPrivate(); };
NET.number=async(day,floor)=>{ const d=await call("number",{day,floor}); return d.n; };
window.KF_NET=NET;

/* ---------- pairing screen ---------- */
let pairShown=false;
function showPair(){
  if(pairShown) return; pairShown=true;
  const el=document.createElement("div"); el.className="pairsheet"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true");
  el.innerHTML=`<form class="pairbox" autocomplete="off"><span class="logo" aria-hidden="true"></span><h2></h2><p class="sub"></p>
    <label><span></span><input type="password" inputmode="numeric" autocomplete="off" maxlength="40" required></label><p class="perr" role="alert"></p><button class="place" type="submit"></button></form>`;
  const fill=()=>{ el.querySelector("h2").textContent=tr("pair.title"); el.querySelector(".sub").textContent=tr("pair.text"); el.querySelector("label span").textContent=tr("pair.code"); el.querySelector("button").textContent=tr("pair.btn"); };
  fill(); document.body.appendChild(el); setTimeout(()=>el.querySelector("input").focus(),50);
  el.querySelector("form").addEventListener("submit",async e=>{
    e.preventDefault(); const b=el.querySelector("button"), pe=el.querySelector(".perr"); b.disabled=true; pe.textContent="";
    try{ const r=await fetch(API+"pair",{method:"POST",headers:HDR,body:JSON.stringify({code:el.querySelector("input").value.trim()}),credentials:"same-origin"}); const d=await r.json().catch(()=>({}));
      if(r.ok){ location.reload(); return; }
      pe.textContent=tr(d.error==="pair_locked"?"pair.locked":d.error==="not_configured"?"pair.off":"pair.wrong"); }
    catch(x){ pe.textContent=tr("pair.net"); }
    b.disabled=false; el.querySelector("input").select();
  });
}

/* ---------- db ---------- */
const PUBLIC=new Set(["c/menu","c/settings","c/staff"]);
const DB={ cache:new Map(), subs:new Set(), timer:null, busy:false, lastCold:new Map(), uid:0 };
const clone=v=>v==null?v:JSON.parse(JSON.stringify(v));
function collKey(c){ return c==="orders"?null:"c/"+c; }
function orderKeys(filters){
  const eq=filters.find(f=>f[0]==="day"&&f[1]==="=="); if(eq) return ["o/"+eq[2]];
  let from=null,to=null;
  for(const [f,op,v] of filters){ if(f!=="createdAt") continue; if(op===">="||op===">") from=Number(v); if(op==="<"||op==="<=") to=Number(v); }
  const end=to!=null?to-1:Date.now(); let start=from!=null?from:end-6*86400000;
  if(end-start>119*86400000) start=end-119*86400000;
  const keys=[]; const d=new Date(start); d.setHours(12,0,0,0);
  while(d.getTime()<=end+12*3600000 && keys.length<121){ keys.push("o/"+dayOf(d.getTime())); d.setDate(d.getDate()+1); }
  return keys;
}
const hot=k=>k.startsWith("c/") || k==="o/"+dayOf(Date.now()) || k==="o/"+dayOf(Date.now()-86400000);
function cmp(a,op,b){ return op==="=="?a===b:op===">="?a>=b:op===">"?a>b:op==="<"?a<b:op==="<="?a<=b:op==="!="?a!==b:false; }
function snapOf(q){
  if(q.doc){ const [c,id]=q.doc; const e=DB.cache.get(collKey(c)); const d=e&&e.docs&&e.docs[id]; return {exists:!!d, id, data:()=>clone(d)||undefined, metadata:{}}; }
  let list=[];
  for(const k of q.keys){ const e=DB.cache.get(k); if(e&&e.docs) for(const [id,d] of Object.entries(e.docs)) list.push({id,d}); }
  list=list.filter(({d})=>q.filters.every(([f,op,v])=>cmp(d[f],op,v)));
  if(q.order){ const [f,dir]=q.order; list.sort((a,b)=>{ const x=a.d[f], y=b.d[f]; return (x<y?-1:x>y?1:0)*(dir==="desc"?-1:1); }); }
  if(q.limit) list=list.slice(0,q.limit);
  const docs=list.map(({id,d})=>({id, data:()=>clone(d), exists:true}));
  return {docs, empty:!docs.length, size:docs.length, metadata:{fromCache:false, hasPendingWrites:false}};
}
async function fetchKeys(keys, force){
  const want={}; for(const k of keys){ const e=DB.cache.get(k); want[k]=force||!e?"":e.etag; }
  if(!Object.keys(want).length) return [];
  const d=await call("data",{keys:want});
  if(d.session===null && NET.session) expired();
  if(d.session) NET.session=d.session;
  const changed=[];
  for(const r of d.results||[]){
    if(r.same) continue;
    DB.cache.set(r.key,{etag:r.etag||"", docs:r.denied?{}:(r.docs||{}), denied:!!r.denied}); changed.push(r.key);
  }
  return changed;
}
function notify(changed){
  for(const s of DB.subs){ if(s.first || s.q.keys.some(k=>changed.includes(k))){ s.first=false; try{ s.cb(snapOf(s.q)); }catch(e){ console.error(e); } } }
}
async function poll(){
  if(DB.busy || !DB.subs.size) return; DB.busy=true;
  try{
    const now=Date.now(), keys=new Set();
    for(const s of DB.subs) for(const k of s.q.keys){ if(hot(k) || !DB.cache.has(k) || now-(DB.lastCold.get(k)||0)>60000){ keys.add(k); if(!hot(k)) DB.lastCold.set(k,now); } }
    const changed=await fetchKeys([...keys]);
    notify(changed);
  }catch(e){ if(e.code==="unavailable"||e.code==="resource_exhausted") for(const s of DB.subs) s.err&&s.err({code:"unavailable_quiet"}); }
  finally{ DB.busy=false; }
}
DB.kick=()=>{ for(const [k,e] of DB.cache) if(e.denied) DB.cache.delete(k); setTimeout(poll,0); };
DB.dropPrivate=()=>{ for(const k of [...DB.cache.keys()]) if(!PUBLIC.has(k) && !hot(k)) DB.cache.delete(k); };
// Order screens check often; other screens and hidden tabs much less (each check is one function call on Netlify).
function interval(){ if(document.visibilityState!=="visible") return 60000; return /^#(till|kitchen|pickup)?$/.test(location.hash||"") || document.body.classList.contains("display") ? 6000 : 15000; }
function schedule(){ clearTimeout(DB.timer); DB.timer=setTimeout(async()=>{ await poll(); schedule(); },interval()); }
window.addEventListener("hashchange",()=>{ if(/^#(till|kitchen|pickup)$/.test(location.hash)){ poll(); schedule(); } });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") poll(); schedule(); });

function query(coll, filters, order, limit){
  const q={coll, filters, order, limit, keys: coll==="orders"?orderKeys(filters):[collKey(coll)]};
  return {
    where:(f,op,v)=>query(coll,[...filters,[f,op,v]],order,limit),
    orderBy:(f,dir)=>query(coll,filters,[f,dir||"asc"],limit),
    limit:n=>query(coll,filters,order,n),

  async getDays(from, to){

  async claimNumber(day, floor){

  async setSettings(d){ if(db){ await retry(()=>db.doc("settings/main").set(d)); return; } local.write("kf_settings",d); L.settingsCb&&L.settingsCb(d); },

async function guard(p){
  try{ await p; return true; }
  catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"){
      let w=null; try{ w = USER ? await USER.can("data.write") : null; }catch(x){}
      if(w===false){ S.readOnly=true; setSync(); toast(t("e.ro")); } else toast(t("e.save"));

    else if(c==="revoked") toast(t("e.revoked"));
    else toast(t("e.save"));
    return false;
  }
}

function chime(){
  if(!S.sound) return;
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume();
    [0,0.18].forEach((d,i)=>{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=i?1175:880;
      const t0=actx.currentTime+d; g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.35,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.35);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0+0.4); });
  }catch(e){}
}

  return rows.length ? rows.map(([l,v,extra])=>`<div class="bar"><div class="t"><span>${esc(l)}</span><span>${money?eur(v):v}${extra?` · ${esc(extra)}`:""}</span></div><div class="track"><div class="fill" style="width:${(v/max*100).toFixed(1)}%"></div></div></div>`).join("")
    : `<div class="muted" style="font-size:.88rem">${esc(t("nosales"))}</div>`;
}
function niceMax(v){ if(v<=0) return 10; const p=Math.pow(10,Math.floor(Math.log10(v))); for(const m of [1,2,2.5,5,10]) if(m*p>=v) return m*p; return 10*p; }
function stats(list){

  const rev=sumBy(()=>true), card=sumBy(o=>o.payment==="Card"), cash=sumBy(o=>o.payment==="Cash"), app=r2(rev-card-cash);
  const vr=num(S.settings.vatRate)??24, vat=r2(rev*vr/(100+vr));

  return {ok, rev, card, cash, app, vr, vat, net:r2(rev-vat), disc, staff, cancelled:list.length-ok.length};
}

async function pinKey(dg){
  if(Date.now()<L2.until || L2.pin.length>=4 || L2.busy) return;
  L2.pin+=dg; L2.err=""; renderLock();
  if(L2.pin.length<4) return;
  const m=S.staff.find(x=>x.id===L2.pickId); const pin=L2.pin;
  if(NET){
    L2.busy=true; const r=await NET.login(L2.pickId, pin); L2.busy=false;
    if(r.ok){ signIn({...m, ...r.member}); return; }
    L2.pin=""; L2.err=t(r.offline?"e.save":"lock.wrong");
    if(r.wait){ L2.until=Date.now()+r.wait*1000; const iv=setInterval(()=>{ if(Date.now()>=L2.until){ clearInterval(iv); L2.err=""; } renderLock(); },1000); }
    renderLock(); const dots=$("#pinDots"); if(dots) dots.classList.add("shake"); return;
  }
  const ok = m && m.active!==false && m.pinHash && (await hashPin(m.salt||"", pin))===m.pinHash;
  if(ok){ signIn(m); return; }
  L2.fails++; L2.pin=""; L2.err=t("lock.wrong");
  if(L2.fails>=5){ L2.until=Date.now()+30000; L2.fails=0; const iv=setInterval(()=>{ if(Date.now()>=L2.until){ clearInterval(iv); L2.err=""; } renderLock(); },1000); }
  renderLock(); const dots=$("#pinDots"); if(dots){ dots.classList.add("shake"); }
}

/* ---------- inventory ---------- */
const UNITS=["kg","g","l","ml","pcs","pack","box"];
const uL = u => t("u."+(UNITS.includes(u)?u:"pcs"));
const r3 = n => Math.round((Number(n)||0)*1000)/1000;
let QF=null;
const fq = n => { if(!QF||QF.l!==LANG) QF={l:LANG,f:new Intl.NumberFormat(LOC[LANG],{maximumFractionDigits:2})}; return QF.f.format(r3(n)).replace("-","−"); };
const normTxt = s => String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9Ѐ-ӿ]+/g," ").trim();
const unitFrom = s => { const x=normTxt(s); if(/^(kg|kilo)/.test(x)) return "kg"; if(/^(g|gr|gramm)/.test(x)) return "g"; if(/^(ml)/.test(x)) return "ml"; if(/^(l|ltr|liit|литр|л)$/.test(x)||/^l /.test(x)) return "l";
  if(/^(pk|pakk|pack|уп)/.test(x)) return "pack"; if(/^(kast|box|кор)/.test(x)) return "box"; return "pcs"; };
S.inv=[]; S.moves=[]; S.invoices=[]; S.invOrders=[]; S.invLoaded=false;
const IV={ tab:"stock", q:"", low:false, open:null, act:null, counting:false, form:null, recOpen:null, invOpen:null, invDel:null, sk:{} };
let invBase=null;

function onInvItems(list){
  S.inv=list.filter(x=>x && x.name).map(x=>({...x, unit:UNITS.includes(x.unit)?x.unit:"pcs", min:Number(x.min)||0, cost:Number(x.cost)||0, aliases:Array.isArray(x.aliases)?x.aliases:[]}));
  S.invLoaded=true; watchUsage(); renderInv();
}
function onMoves(list){ S.moves=list.filter(m=>m && m.itemId); watchUsage(); renderInv(); }
function onInvoices(list){ S.invoices=list.filter(Boolean).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)); renderInv(); }
function movesByItem(){ const m={}; for(const x of S.moves){ (m[x.itemId]=m[x.itemId]||[]).push(x); } for(const k in m) m[k].sort((a,b)=>a.at-b.at); return m; }
function baselineOf(item, list){
  list = list || S.moves.filter(m=>m.itemId===item.id); let last=null;
  for(const m of list) if(m.type==="count" && (!last || m.at>last.at)) last=m;
  return last ? {qty:Number(last.qty)||0, since:Number(last.at)||0, count:last} : {qty:0, since:Number(item.createdAt)||0, count:null};
}
function watchUsage(){
  if(!db || !S.inv.length) return;
  const mv=movesByItem();
  const b=Math.min(...S.inv.filter(x=>x.active!==false).map(x=>baselineOf(x, mv[x.id]||[]).since));
  if(!isFinite(b) || b===invBase) return;
  invBase=b;
  store.subColl("invOrders","orders", list=>{ S.invOrders=list; renderInv(); }, c=>c.where("createdAt",">=",b).orderBy("createdAt","desc").limit(3000));
}
const usageOrders = () => db ? S.invOrders : localOrders();
function usageIndex(){
  const byName={}; S.menu.forEach(m=>{ if(Array.isArray(m.recipe) && m.recipe.length) byName[m.name]=m.recipe; });
  const u={};
  for(const o of usageOrders()){
    if(!o || o.status==="cancelled") continue;
    for(const l of items(o)){ const rc=byName[l.name]; if(!rc) continue;
      for(const r of rc){ if(r.opt && r.opt!==(l.option||"")) continue; (u[r.itemId]=u[r.itemId]||[]).push([Number(o.createdAt)||0, (Number(r.qty)||0)*int(l.qty)]); } }
  }
  return u;
}
function computeStock(){
  const mv=movesByItem(), us=usageIndex(), out={};
  for(const it of S.inv){
    const list=mv[it.id]||[], b=baselineOf(it,list); let q=b.qty, inS=0, wS=0, uS=0;
    for(const m of list){ if(m.type==="count" || !(m.at>b.since)) continue; const v=Number(m.qty)||0;
      if(m.type==="waste"){ q-=Math.abs(v); wS+=Math.abs(v); } else { q+=v; if(m.type==="delivery") inS+=v; } }
    for(const [at,v] of (us[it.id]||[])) if(at>b.since){ q-=v; uS+=v; }
    q=r3(q);
    const st = q<=0 ? "out" : (it.min>0 && q<=it.min) ? "low" : "ok";
    out[it.id]={qty:q, base:b, inS:r3(inS), wS:r3(wS), uS:r3(uS), st, moves:list};
  }
  return out;
}
const staffName = id => (S.staff.find(x=>x.id===id)||{}).name||"";

function renderInv(){
  const sk=computeStock(); IV.sk=sk;

  $("#ik-items").textContent=act.length; $("#ik-low").textContent=low; $("#ik-value").textContent=eur(value); $("#ik-buy").textContent=eur(buy);

  ["stock","invoices","recipes"].forEach(k=>{ $("#inv-"+k).hidden = IV.tab!==k; });

let SAMPLE=undefined, ASSETS=undefined;
async function getSample(){ if(SAMPLE!==undefined) return SAMPLE; try{ SAMPLE = (!DEMO && window.claude && window.claude.use) ? await window.claude.use("sample") : null; }catch(e){ SAMPLE=null; } return SAMPLE; }
async function getAssets(){ if(ASSETS!==undefined) return ASSETS; try{ ASSETS = (!DEMO && window.claude && window.claude.use) ? await window.claude.use("assets") : null; }catch(e){ ASSETS=null; } return ASSETS; }
let SC=null;
const OK_TYPES=["image/jpeg","image/png","image/webp","image/gif"];
async function shrink(file){
  if(OK_TYPES.includes(file.type) && file.size<3.5*1024*1024) return file;
  const bmp=await createImageBitmap(file); const k=Math.min(1, 2400/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",0.86));
}
async function uploadPhoto(blob){ const a=await getAssets(); if(!a) return null; try{ const r=await a.upload(blob, OK_TYPES.includes(blob.type)?undefined:{type:"image/jpeg"}); return r.id; }catch(e){ return null; } }
function openScan(){ $("#scan").hidden=false; renderScan(); }
function closeScan(){ if(SC && SC.ctl) try{ SC.ctl.abort(); }catch(e){} if(SC && SC.url && !SC.keepUrl) try{ URL.revokeObjectURL(SC.url); }catch(e){} SC=null; $("#scan").hidden=true; $("#invFile").value=""; }
$("#scanClose").addEventListener("click",()=>{ if(SC && SC.state==="saving") return; closeScan(); });

$("#invFile").addEventListener("change",e=>{ const f=e.target.files && e.target.files[0]; if(f) startScan(f); });
const emptyData = () => ({supplier:"", number:"", date:dayKey(), net:null, vat:null, total:null, lines:[]});
const blankLine = () => ({text:"", qty:1, unit:"", unitPrice:null, lineTotal:null, kind:"product", match:"", stockQty:null, newName:"", newUnit:"pcs", conf:"high"});
function invPrompt(){
  const list=S.inv.filter(x=>x.active!==false).map(x=>({id:x.id, name:x.name, unit:x.unit, knownAs:x.aliases.slice(-6).map(a=>a.raw||a.t)}));
  return `You read supplier invoices (arved / счета) for King's Food, a Turkish kebab kiosk in Tallinn, Estonia. The photo is a purchase invoice or delivery note, usually in Estonian, sometimes English or Russian. Typical suppliers: Sanitex, Hanse Food, Franklin, Sultan Baklava, Selver, Rimi, Metro.

Read every product line and reply with ONLY this JSON (numbers with a dot as decimal separator, no thousands separators):
{"supplier": string, "invoiceNumber": string, "date": "YYYY-MM-DD" or "", "netTotal": number|null, "vatTotal": number|null, "grandTotal": number|null,
 "lines": [{"text": string, "qty": number, "unit": string, "unitPrice": number|null, "lineTotal": number|null, "kind": "product"|"deposit"|"discount"|"fee",
   "itemId": string|null, "stockQty": number|null, "suggestName": string, "suggestUnit": "kg"|"g"|"l"|"ml"|"pcs"|"pack"|"box", "confidence": "high"|"medium"|"low"}]}

Rules:
- One entry per printed product line, in printed order. "text" = the product name exactly as printed. Skip header, address and payment lines.
- lineTotal = the line amount WITHOUT VAT (käibemaksuta / km-ta) when the invoice shows both; unitPrice likewise.
- kind "deposit" for bottle/packaging deposits (pant, pandipakend, tagatisraha), "discount" for discounts, "fee" for delivery or service fees.
- Match each product line to ONE of our stock items below by "itemId" only when it is clearly the same product (consider knownAs names); otherwise null. Never invent ids.
- stockQty = the quantity expressed in the matched item's unit (e.g. 2 boxes x 10 kg for an item in kg -> 20; 6 x 1,5 l bottles for an item in pcs -> 6). null when unmatched or unsure.
- suggestName = a short clean product name for a new stock item (e.g. "Kanakintsuliha", "Tortilla 30 cm"); suggestUnit = the natural stock unit for it.
- confidence = how sure you are about the reading AND the match of that line.
- Do not invent lines you cannot read. If the photo is not an invoice or receipt, reply {"error":"not_invoice"}.

Our stock items (JSON): ${JSON.stringify(list)}`;
}
function normalize(res){
  const n=v=>{ const x=typeof v==="number"?v:num(v); return x===null||!isFinite(x)?null:r3(x); };
  const d=emptyData();
  d.supplier=String(res.supplier||"").slice(0,80); d.number=String(res.invoiceNumber||"").slice(0,40);
  d.date=/^\d{4}-\d{2}-\d{2}$/.test(String(res.date||""))?String(res.date):dayKey();
  d.net=n(res.netTotal); d.vat=n(res.vatTotal); d.total=n(res.grandTotal);
  d.lines=(Array.isArray(res.lines)?res.lines:[]).slice(0,80).map(l=>{
    const kind=["product","deposit","discount","fee"].includes(l.kind)?l.kind:"product";
    const it=l.itemId && S.inv.find(x=>x.id===String(l.itemId) && x.active!==false);
    const conf=["high","medium","low"].includes(l.confidence)?l.confidence:"medium";
    const q=n(l.qty)??1;
    return {text:String(l.text||"").slice(0,120), qty:q, unit:String(l.unit||"").slice(0,12), unitPrice:n(l.unitPrice), lineTotal:n(l.lineTotal), kind, conf,
      match: kind!=="product" ? "" : it ? it.id : "new", stockQty: it ? (n(l.stockQty) ?? q) : q,
      newName:String(l.suggestName||l.text||"").slice(0,60), newUnit:UNITS.includes(l.suggestUnit)?l.suggestUnit:unitFrom(l.unit), aiMatched:!!it};
  });
  return d;
}
function applyLearned(d){
  const sup=normTxt(d.supplier);
  for(const l of d.lines){ if(l.kind!=="product") continue; const tx=normTxt(l.text); if(!tx) continue;
    for(const it of S.inv){ if(it.active===false) continue; const a=it.aliases.find(a=>a.t===tx && (!a.s || !sup || a.s===sup));
      if(a){ l.match=it.id; l.stockQty=r3(l.qty*(Number(a.f)||1)); l.learned=true; break; } } }
}
function dupOf(d){ const s=normTxt(d.supplier), n=normTxt(d.number), me=SC&&SC.edit?SC.edit.id:null; if(!n) return null; return S.invoices.find(v=>v.id!==me && normTxt(v.number)===n && (!s || normTxt(v.supplier)===s)) || null; }
function totalCheck(d){
  const sum=r2(d.lines.reduce((s,l)=>s+(Number(l.lineTotal)||0),0)), ref = d.net ?? (d.total!=null && d.vat!=null ? r2(d.total-d.vat) : null);
  if(ref===null || !d.lines.some(l=>l.lineTotal!=null)) return {sum, ref, ok:null};
  return {sum, ref, ok: Math.abs(sum-ref) <= Math.max(0.05, Math.abs(ref)*0.01)};
}
function readyToApply(d){
  if(dupOf(d)) return false; const tc=totalCheck(d); if(tc.ok!==true) return false;
  const prods=d.lines.filter(l=>l.kind==="product"); if(!prods.length) return false;
  return prods.every(l=>l.match && l.match!=="new" && Number(l.stockQty)>0 && (l.learned || l.conf==="high"));
}
async function startScan(file){
  SC={state:"reading", url:URL.createObjectURL(file)}; openScan();
  const my=SC; let blob=file; try{ blob=await shrink(file); }catch(e){}
  if(SC!==my) return; SC.blob=blob; SC.photoP=uploadPhoto(blob);
  await runAI();
}
async function runAI(){
  const my=SC; if(!my) return;
  const sample=await getSample(); if(SC!==my) return;
  let lim=null; try{ lim = sample ? await sample.limits() : null; }catch(e){}
  if(!sample || !lim || !lim.images){ my.state="review"; my.manual=true; my.note=t("scan.noAI"); my.data=emptyData(); my.data.lines.push(blankLine()); renderScan(); return; }
  my.state="reading"; my.err=""; renderScan();
  my.ctl=new AbortController();
  try{
    const res=await sample.json(invPrompt(), {images:[my.blob], signal:my.ctl.signal, modelTier:"default"});
    if(SC!==my) return;
    if(!res || typeof res!=="object" || res.error){ my.state="error"; my.err=t(res && res.error==="not_invoice"?"scan.e.notInvoice":"scan.e.read"); renderScan(); return; }
    my.data=normalize(res); applyLearned(my.data);
    if(!my.data.lines.length){ my.state="error"; my.err=t("scan.e.noLines"); renderScan(); return; }
    my.state="review";
    if(S.settings.autoApply && readyToApply(my.data)){ await applyInvoice(true); return; }
    renderScan();
  }catch(e){
    if(SC!==my) return; const c=e&&e.code;
    if(c==="cancelled") return;
    my.state="error"; my.retry = !["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(c);
    my.err = c==="not_granted"||c==="sampling_disabled" ? t("scan.e.off") : c==="image_rejected" ? t("scan.e.image") : c==="rate_limited" ? t("scan.e.limit") : c==="session_expired" ? t("scan.e.session") : t("scan.e.read");
    renderScan();
  }
}
function lineRow(l,i){
  const act=S.inv.filter(x=>x.active!==false || x.id===l.match).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const it=S.inv.find(x=>x.id===l.match), unitCost = l.lineTotal!=null && Number(l.stockQty)>0 ? r2(l.lineTotal/l.stockQty) : null;
  const tag = l.learned ? `<span class="tag ok">${esc(t("scan.learned"))}</span>` : l.kind!=="product" ? `<span class="tag">${esc(t("scan.k."+l.kind))}</span>` : l.conf==="low" ? `<span class="tag warn">${esc(t("scan.check"))}</span>` : "";
  return `<div class="sline ${l.match===""?"ign":""}" data-li="${i}">
    <div class="sl-a"><input data-lk="text" value="${esc(l.text)}" placeholder="${esc(t("inv.r.line"))}" aria-label="${esc(t("inv.r.line"))}">

function mdLite(s){
  const lines=esc(s).split("\n"); let out="", list=null;
  const inline = x => x.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/__(.+?)__/g,"<b>$1</b>").replace(/(^|[\s(])\*(?!\s)(.+?)\*(?=[\s).,!?:;]|$)/g,"$1<i>$2</i>").replace(/`([^`]+)`/g,"<code>$1</code>");
  const close = () => { if(list){ out+=`</${list}>`; list=null; } };
  for(const raw of lines){
    const l=raw.trimEnd();
    let mm;
    if((mm=l.match(/^\s*(?:[-•*])\s+(.*)$/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+=`<li>${inline(mm[1])}</li>`; continue; }
    if((mm=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+=`<li>${inline(mm[1])}</li>`; continue; }
    close();
    if((mm=l.match(/^#{1,4}\s+(.*)$/))){ out+=`<p class="h">${inline(mm[1])}</p>`; continue; }
    if(!l.trim()){ continue; }
    out+=`<p>${inline(l)}</p>`;
  }
  close(); return out;
}

  const acts=(m.actions||[]).map((a,j)=>`<span class="aact ${a.undone?"undone":""}"><span>✓ ${esc(a.label)}</span>${a.undo&&!a.undone&&!a.stale?`<button class="aundo" data-iaundo="${i}:${j}">${esc(t("undo"))}</button>`:a.undone?`<small>${esc(t("ai.undone"))}</small>`:""}</span>`).join("");
  const body = m.pending ? `<div class="athink"><span class="dots"><i></i><i></i><i></i></span> ${esc(t(m.steps&&m.steps.length?"ai.working":"ai.thinking"))}</div>` : (m.text?`<div class="amd">${mdLite(m.text)}</div>`:"");
  const tools = !m.pending && m.text ? `<div class="atools"><button class="aibtn" data-iacopy="${i}">${esc(t("ai.copy"))}</button><span class="atime">${hm(m.at)}</span></div>` : "";
  return `<div class="aim a" data-ii="${i}"><span class="logo aiav" aria-hidden="true"></span><div class="bub">${steps?`<div class="asteps">${steps}</div>`:""}${body}${acts?`<div class="aacts">${acts}</div>`:""}${m.err?`<p class="aerr">${esc(m.err)}</p>`:""}${tools}</div></div>`;
}
function iaRender(){
  const d=$("#iaDrawer"); if(!d) return;
  if(S.user) iaLoad();
  const avail = AI.lim!==null && !DEMO, ready=AI.lim!==undefined;
  $("#iaOpen").hidden = !avail && ready;
  d.hidden=!IA.open; document.body.classList.toggle("iadrawon", IA.open);
  if(!IA.open) return;
  $("#iaStatus").textContent = !ready ? t("sync.wait") : AI.lim===null ? t("ai.st.off") : AI.lim.tools ? t("ia.st.live") : t("ai.st.basic");
  $("#iaDot").className = "dot "+(!ready?"":AI.lim===null?"shut":"live");
  $("#iaNew").hidden=!IA.msgs.length; $("#iaStop").hidden=!IA.busy; $("#iaSend").disabled=IA.busy||AI.lim===null;
  $("#iaCam").hidden=!(AI.lim && AI.lim.images);
  iaRenderMic(); iaRenderThumbs();
  if(!IA.msgs.length) $("#iaMsgs").innerHTML=`<div class="aiwelcome iaw"><span class="logo"></span><h3>${esc(t("ia.hello"))}</h3><p>${esc(t(AI.lim===null?"ai.e.unavailable":"ia.intro"))}</p></div>`;
  else $("#iaMsgs").innerHTML=IA.msgs.map(iaMsgHtml).join("");
  iaRenderChips();
}
function iaRenderChips(){
  const ph=IA.photos.length>0, keys= ph ? ["ia.p1","ia.p2"] : (S.inv.length ? ["ia.q1","ia.q2","ia.q3","ia.q4","ia.q5","ia.q6"] : ["ia.s1","ia.s2","ia.s3"]);
  $("#iaChips").innerHTML = AI.lim===null||IA.busy ? "" : keys.map(k=>`<button class="chip${ph?" pq":""}" data-iaq="${k}">${ph?"📷 ":""}${esc(t(k))}</button>`).join("");
  $("#iaChips").hidden = !ph && IA.msgs.length>2;
}
function iaRenderLast(){ const i=IA.msgs.length-1, el=document.querySelector(`#iaMsgs [data-ii="${i}"]`); if(!el){ iaRender(); return; } el.outerHTML=iaMsgHtml(IA.msgs[i],i); }
function iaRenderMic(){ const b=$("#iaMic"); if(!b) return; b.hidden=!AI.dict || AI.lim===null; const on=AI.dictState!=="idle" && AI.dictTarget==="ia"; b.classList.toggle("on",on); b.setAttribute("aria-pressed",String(on)); b.title=t(on?"ai.micStop":"ai.mic"); b.setAttribute("aria-label",b.title); }
function iaRenderThumbs(){ const el=$("#iaThumbs"); if(!el) return; el.hidden=!IA.photos.length;
  el.innerHTML=IA.photos.map((p,i)=>`<span class="aith"><img src="${esc(p.url)}" alt="${esc(t("ai.cam.photo"))}"><button type="button" data-iarm="${i}" aria-label="${esc(t("ai.cam.remove"))}">×</button></span>`).join(""); if($("#iaChips")) iaRenderChips(); }
function iaScroll(force){ const el=$("#iaMsgs"); if(force || el.scrollHeight-el.scrollTop-el.clientHeight<140) el.scrollTop=el.scrollHeight; }
function iaAutosize(){ const ta=$("#iaInput"); ta.style.height="auto"; ta.style.height=Math.min(140, ta.scrollHeight)+"px"; }
function openIa(){ IA.open=true; iaRender(); iaScroll(true); setTimeout(()=>{ try{ $("#iaInput").focus({preventScroll:true}); }catch(e){} },50); }
function closeIa(){ const was=IA.open; IA.open=false; if(was) setTimeout(()=>{ try{ $("#iaOpen").focus({preventScroll:true}); }catch(e){} },0); if(AI.dict && AI.dict.active() && AI.dictTarget==="ia") AI.dict.stop().catch(()=>{}); iaRender(); }
$("#iaOpen").addEventListener("click",openIa);
$("#iaClose").addEventListener("click",closeIa);
$("#iaScrim").addEventListener("click",closeIa);
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && IA.open && $("#scan").hidden) closeIa(); });
$("#iaForm").addEventListener("submit",e=>{ e.preventDefault(); iaSend(); });
$("#iaInput").addEventListener("keydown",e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); iaSend(); } });
$("#iaInput").addEventListener("input",iaAutosize);
$("#iaStop").addEventListener("click",()=>{ if(IA.ctl) IA.ctl.abort(); });
$("#iaNew").addEventListener("click",()=>{ if(IA.busy) return; IA.msgs=[]; iaSave(); iaRender(); });
$("#iaChips").addEventListener("click",e=>{ const b=e.target.closest("[data-iaq]"); if(!b) return; const k=b.dataset.iaq;
  if(k==="ia.q3"||k==="ia.s2"){ const ta=$("#iaInput"); ta.value=t(k+"t"); ta.focus(); iaAutosize(); return; }
  const v=$("#iaInput").value.trim(); iaSend(k.startsWith("ia.p")&&v ? v+"\n"+t(k) : t(k)); });
$("#iaMic").addEventListener("click",()=>{ const d=AI.dict; if(!d) return;
  if(d.active()){ if(AI.dictTarget==="ia") AI.sendAfterDict=true; d.stop().catch(()=>{}); return; }
  AI.dictTarget="ia";
  d.start({language:LOC[LANG]}).catch(e=>{ const c=e&&e.code; if(c==="not_granted") toast(t("ai.e.micOff")); else if(c==="unavailable"){ AI.dict=null; iaRenderMic(); } else if(c!=="stopped" && c!=="dismissed") toast(t("ai.e.mic")); });
});
$("#iaCam").addEventListener("click",()=>$("#iaFile").click());
$("#iaFile").addEventListener("change",e=>{ const max=Math.min(3,(AI.lim&&AI.lim.images&&AI.lim.images.maxCount)||3); let bad=0;
  for(const f of Array.from(e.target.files||[])){ if(IA.photos.length>=max){ toast(t("ai.cam.max",{n:max})); break; } if(!/^image\//.test(f.type) || f.size>20e6){ bad++; continue; } IA.photos.push({blob:f, url:URL.createObjectURL(f)}); }
  if(bad) toast(t("ai.e.photo")); e.target.value=""; iaRenderThumbs(); });
$("#iaThumbs").addEventListener("click",e=>{ const r=e.target.closest("[data-iarm]"); if(r){ const p=IA.photos.splice(+r.dataset.iarm,1)[0]; try{ URL.revokeObjectURL(p.url); }catch(x){} iaRenderThumbs(); } });
$("#iaMsgs").addEventListener("click",async e=>{
  const c=e.target.closest("[data-iacopy]"); if(c){ const m=IA.msgs[+c.dataset.iacopy]; try{ await navigator.clipboard.writeText(plain(m.text)); toast(t("ai.copied")); }catch(x){ toast(t("ai.e.copy")); } return; }
  const u=e.target.closest("[data-iaundo]"); if(u){ const [i,j]=u.dataset.iaundo.split(":").map(Number); const a=IA.msgs[i]&&IA.msgs[i].actions[j]; if(a && a.undo && !a.undone){ u.disabled=true; await a.undo(); a.undone=true; iaSave(); iaRender(); } }
});

/* ---------- data flow ---------- */
function onMenu(list){
  S.menuLoaded=true;
  S.menu=list.filter(m=>m && m.name).map(m=>({...m, price:Number(m.price)||0, options:Array.isArray(m.options)?m.options.map(String).filter(Boolean):[]}));
  renderTill(); renderEditor(); renderInv();
}
function onSettings(d){ if(d && typeof d==="object") S.settings={...S.settings, ...d, quickNotes:Array.isArray(d.quickNotes)?d.quickNotes.map(String):S.settings.quickNotes}; renderQuickNotes(); renderSettings(); renderSales(); renderRecords(); }
let readySeen=null; const readyPop=new Set();
function onToday(list){
  if(seen){ const fresh=list.filter(o=>o.status==="new" && !seen.has(o.id)); if(fresh.length){ fresh.forEach(o=>freshIds.add(o.id)); if(S.view!=="pickup") chime(); setTimeout(()=>fresh.forEach(o=>freshIds.delete(o.id)),3000); } }
  seen=new Set(list.map(o=>o.id));
  const nowReady=list.filter(o=>o.status==="ready");
  if(readySeen){ const fr=nowReady.filter(o=>!readySeen.has(o.id)); if(fr.length){ fr.forEach(o=>readyPop.add(o.id)); if(S.view==="pickup") chime(); setTimeout(()=>{ fr.forEach(o=>readyPop.delete(o.id)); },4000); } }
  readySeen=new Set(nowReady.map(o=>o.id));
  S.today=list; renderBoard(); renderPickup(); renderTicket();
  if(!db) renderInv();
}
function renderAll(){ renderLock(); renderQuickNotes(); renderTill(); renderBoard(); renderPickup(); renderSales(); renderEditor(); renderRecords(); renderSettings(); renderInv(); renderAi(); }

function tick(){
  const d=new Date(), tm=pad(d.getHours())+":"+pad(d.getMinutes()), h=d.getHours();
  let dl; try{ dl=d.toLocaleDateString(LOC[LANG],{weekday:"short",day:"numeric",month:"short"}); }catch(e){ dl=dmy(d); }
  $("#clock").textContent = dl+" · "+tm;
  $("#ticketDate").textContent = dmy(d)+" · "+tm;
  $("#pClock").textContent = tm;
  $("#openPill").hidden = (h>=OPEN_H && h<CLOSE_H);
  if(dayKey()!==S.todayKey){
    const followSales = S.day===S.todayKey;
    S.todayKey=dayKey(); S.lastOrder=null; watchToday();
    if(followSales){ S.day=S.todayKey; $("#dayIn").value=S.day; watchSalesDay(); }
  }
  const aiBusy = typeof AI!=="undefined" && (AI.busy || AI.dictState!=="idle" || AI.ttsState!=="idle" || (typeof IA!=="undefined" && IA.busy));
  if(aiBusy) lastAct=Date.now();
  if(S.user && !KEEP_VIEWS.includes(S.view) && Date.now()-lastAct>AUTOLOCK_MS) lock();
  if(!$("#lock").hidden && L2.mode!=="pin") renderLock();
  if(S.user) renderUser();
  if(S.view==="kitchen") document.querySelectorAll("#v-kitchen .age[data-c]").forEach(el=>{
    const m=Math.max(0,Math.floor((Date.now()-Number(el.dataset.c))/60000)); el.textContent = m<1?t("justnow"):t("min",{n:m});
    el.classList.toggle("late", el.dataset.st!=="ready" ? m>=15 : m>=10); });
}
setInterval(tick, 20000);

async function start(){
  if(!DEMO){ try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; } }
  S.live=!!db;
  if(db){ try{ USER=await window.claude.use("user"); const w=USER ? await USER.can("data.write") : null; if(w===false) S.readOnly=true; }catch(e){} }
  S.offlineOk = !db && local.read("kf_offline_ok", false)===true;
  S.connecting=false;
  setSync();
  store.subMenu(onMenu); store.subSettings(onSettings);
  store.subColl("staff","staff", onStaff);
  const since=Date.now()-3*86400000; store.subColl("shRecent","shifts", list=>onShifts(list.filter(x=>x.in>=since || !x.out)), c=>c.where("in",">=",since));
  setShQuick("week");
  store.subColl("inv","inv", onInvItems); store.subColl("invmoves","invmoves", onMoves); store.subColl("invoices","invoices", onInvoices);
  watchToday(); watchSalesDay(); setQuick("today");
  aiInit();
}
$("#dayIn").value=S.day; $("#recFrom").value=S.day; $("#recTo").value=S.day;
fmtInit();
const h0=(location.hash||"").replace("#",""); if(VIEWS.includes(h0)) S.view=h0;
show(S.view); applyLang();
window.addEventListener("hashchange",()=>{ const v=(location.hash||"").replace("#",""); if(VIEWS.includes(v) && v!==S.view) show(v); });
if(NET) window.addEventListener("kf:session-expired",()=>{ if(S.user){ lock(); toast(t("e.session")); } });
start();
})();

</script>
